<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070713" />
    <title>MovizzQuizz offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 10%, rgba(99,102,241,.30), transparent 34%), radial-gradient(circle at 90% 90%, rgba(236,72,153,.22), transparent 36%), #070713; color: #fff; }
      main { width: min(460px, 100%); border: 1px solid rgba(255,255,255,.14); border-radius: 28px; padding: 24px; background: rgba(255,255,255,.07); box-shadow: 0 24px 80px rgba(0,0,0,.36); }
      h1 { margin: 0 0 10px; font-size: clamp(34px, 10vw, 58px); line-height: .92; letter-spacing: -.06em; }
      p { margin: 0 0 18px; color: #cbd5e1; line-height: 1.55; }
      button { width: 100%; min-height: 48px; border: 0; border-radius: 16px; color: #fff; background: linear-gradient(135deg, #6366f1, #ec4899); font-weight: 900; }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está offline.</h1>
      <p>O MovizzQuizz precisa de conexão para criar salas, entrar em partidas e sincronizar respostas em tempo real. Verifique sua internet e tente novamente.</p>
      <button onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
